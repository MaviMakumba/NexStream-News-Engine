worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    client_max_body_size 10m;

    # Rate limiting zone'ları
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Güvenlik denetimi: Grafana ve frontend tamamen limitsizdi. Grafana'nın login
    # formu brute-force'a açıktı; genel trafik ise sadece uygulama katmanına
    # (slowapi) bağımlıydı. Grafana insan kullanımı olduğu için dar, genel web
    # trafiği tarayıcının paralel istekleri düşünülerek geniş tutuldu.
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/s;

    # WebSocket upgrade desteği — Upgrade header'ı yoksa bağlantı normal kapanır
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tarayıcı özelliklerini varsayılan olarak kapat — bu uygulama hiçbirini kullanmıyor.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP (güvenlik denetimi: tamamen eksikti). Bir XSS bulunursa etkisini sınırlar.
    # 'unsafe-inline' MECBUREN açık: proje inline style objeleri kullanıyor ve Next.js
    # hydration için inline script gömüyor (nonce'a geçiş ayrı bir iş, bkz. CLAUDE.md).
    # connect-src'de wss: var çünkü /ws/feed canlı akışı WebSocket kullanıyor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Upstream definitions
    upstream api {
        server app:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream grafana {
        server grafana:3000;
    }

    # HTTP → HTTPS redirect (production)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Public API v1 — prefix SİLİNMEDEN geçirilir (FastAPI router'ın kendi
        # prefix'i zaten /api/v1/... olduğu için genel /api/ bloğu gibi
        # silseydi dışarıdan doğru yol /api/api/v1/... olurdu). nginx en uzun
        # eşleşen location'ı seçtiği için bu blok genel /api/ bloğundan önce gelir.
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API (diğer tüm rotalar) — WebSocket upgrade header'ları /ws/feed'in
        # prod'da nginx arkasında çalışması için gerekli.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoint (no rate limit)
        location /api/health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana — login formu brute-force'a karşı dar bir limitle korunur.
        location /grafana/ {
            limit_req zone=grafana burst=10 nodelay;
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        location / {
            limit_req zone=web burst=100 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
