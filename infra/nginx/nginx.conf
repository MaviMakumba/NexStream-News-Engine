worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Kötücül tarama botu — 1 Eyl 2026'da nginx log analizinde bulundu: .env,
    # docker-compose.key, phpinfo.php, ~backup gibi generic PHP/CRM exploit
    # path'lerini deniyor (spoofed Chrome/Mac user-agent). Zarar YOK (hepsine
    # 301/404 dönmüş, hiçbir şey sızmamış) ama son 2 haftalık trafiğin TEK
    # BAŞINA %60'ını (30.424/50.233 istek) oluşturuyordu — log gürültüsü +
    # gereksiz yük. IP seviyesinde engellendi (403).
    deny 213.136.90.179;

    # 8 Eyl 2026: site Cloudflare proxy'sinin arkasına geçti — nginx artık HER
    # isteği Cloudflare'in edge IP'sinden görüyor, $remote_addr TÜM
    # ziyaretçiler için aynı/paylaşılan birkaç IP'ye düşüyor. Bu, aşağıdaki
    # limit_req_zone'ların (hepsi $binary_remote_addr'a dayanıyor) rate
    # limiting'i "ziyaretçi başına" değil "Cloudflare edge node başına"
    # uygulamasına yol açar — hem yanlışlıkla meşru trafiği toplu 429'a
    # düşürebilir hem de gerçek bir saldırganı normal trafikten ayırt
    # edilemez hale getirir. Cloudflare'in resmi IP aralıklarını güvenilir
    # proxy olarak tanımlayıp gerçek ziyaretçi IP'sini `CF-Connecting-IP`
    # header'ından okuyoruz — real_ip_module $remote_addr'ı İSTEK
    # İŞLENMEDEN ÖNCE yeniden yazdığı için hem log_format hem limit_req_zone
    # hem de aşağıdaki `X-Real-IP $remote_addr` ile app'e iletilen değer
    # (slowapi'nin dayandığı) TEK bir düzeltmeyle hepsi doğru IP'yi görür.
    # Liste https://www.cloudflare.com/ips-v4 + ips-v6'dan alındı (nadiren
    # değişir, Cloudflare değişiklik olursa duyurur).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    client_max_body_size 10m;

    # Rate limiting zone'ları
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Güvenlik denetimi: Grafana ve frontend tamamen limitsizdi. Grafana'nın login
    # formu brute-force'a açıktı; genel trafik ise sadece uygulama katmanına
    # (slowapi) bağımlıydı. Grafana insan kullanımı olduğu için dar, genel web
    # trafiği tarayıcının paralel istekleri düşünülerek geniş tutuldu.
    limit_req_zone $binary_remote_addr zone=grafana:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/s;

    # WebSocket upgrade desteği — Upgrade header'ı yoksa bağlantı normal kapanır
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # NOT (18 Ağu 2026'da bulunan bug): security header'lar BURADA (http{} seviyesinde)
    # tanımlıydı ama HİÇ KULLANICIYA ULAŞMIYORDU — nginx `add_header` mirası şu kurala
    # tabi: bir server/location kendi `add_header`'ını tanımlarsa üst seviyedekiler
    # (buradakiler dahil) o context için TAMAMEN İPTAL olur, tek tek eklenmiş gibi
    # davranmaz. Aşağıdaki 443 server bloğu zaten kendi `add_header
    # Strict-Transport-Security`'sini tanımlıyordu, o yüzden bu 6 satır sessizce hiç
    # gönderilmiyordu (canlıda `curl -sI` ile doğrulandı — sadece HSTS geliyordu).
    # Çözüm: hepsini TEK context'te (443 server bloğunda, HSTS'in yanında) topla.
    # Genel kural: nginx'te add_header kullanırken, o header'ı görmesi gereken HER
    # server/location bloğunun kendi add_header'ı olup olmadığını kontrol et.

    # Upstream definitions
    upstream api {
        server app:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # NOT: grafana için bilerek `upstream` bloğu YOK — bkz. location /grafana/.

    # HTTP → HTTPS redirect (production)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server — asıl uygulama (2 Eyl 2026'da nexstreamnews.com'a taşındı,
    # bkz. aşağıdaki eski-domain yönlendirme bloğu). Sertifika üçünü de kapsıyor
    # (SAN: nexstreamnews.com, www.nexstreamnews.com, nexstreamnewsengine.duckdns.org)
    # — `certbot ... --expand` ile AYNI live/ dizinine eklendi, ssl_certificate
    # yolu değişmedi.
    server {
        listen 443 ssl default_server;
        server_name nexstreamnews.com www.nexstreamnews.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ACME HTTP-01 challenge 443'te de servis edilir (13 Eyl 2026): Cloudflare
        # 'Always Use HTTPS' Let's Encrypt'in HTTP isteğini HTTPS'e yönlendirebilir;
        # burada karşılık yoksa istek frontend'e düşüp 404 verir, yenileme sessizce
        # kırılır. Port 80 bloğuyla aynı webroot (certbot_webroot volume, :ro).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Security headers — HEPSİ burada, tek context'te (bkz. yukarıdaki not).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Tarayıcı özelliklerini varsayılan olarak kapat — bu uygulama hiçbirini kullanmıyor.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # CSP (güvenlik denetimi: tamamen eksikti). Bir XSS bulunursa etkisini sınırlar.
        # 'unsafe-inline' MECBUREN açık: proje inline style objeleri kullanıyor ve Next.js
        # hydration için inline script gömüyor (nonce'a geçiş ayrı bir iş, bkz. CLAUDE.md).
        # connect-src'de wss: var çünkü /ws/feed canlı akışı WebSocket kullanıyor.
        # 18 Ağu 2026'da CSP eklenince /api/docs (Swagger UI) beyaz sayfa vermeye
        # başladı — FastAPI'nin varsayılan /docs'u JS/CSS'ini cdn.jsdelivr.net'ten
        # çekiyor (curl ile doğrulandı: swagger-ui-bundle.js + swagger-ui.css),
        # önceki CSP'de script-src/style-src'de yoktu, tarayıcı sessizce
        # engelliyordu. cdn.jsdelivr.net script-src+style-src'e eklendi.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # Public API v1 — prefix SİLİNMEDEN geçirilir (FastAPI router'ın kendi
        # prefix'i zaten /api/v1/... olduğu için genel /api/ bloğu gibi
        # silseydi dışarıdan doğru yol /api/api/v1/... olurdu). nginx en uzun
        # eşleşen location'ı seçtiği için bu blok genel /api/ bloğundan önce gelir.
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API (diğer tüm rotalar) — WebSocket upgrade header'ları /ws/feed'in
        # prod'da nginx arkasında çalışması için gerekli.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus metrikleri (12 Eyl 2026 güvenlik turu): genel /api/ bloğu
        # üzerinden herkese açıktı — endpoint listesi, istek sayıları, Groq token
        # sayacı dışarıdan okunabiliyordu. Prometheus metrikleri Docker iç ağından
        # (app:8000/metrics, bkz. infra/prometheus/prometheus.yml) topluyor, nginx'e
        # hiç uğramıyor; dışarıya kapatmak hiçbir şeyi bozmaz. `=` tam eşleşme:
        # nginx exact-match'i prefix bloklarından (/api/) önce seçer.
        location = /api/metrics {
            return 404;
        }

        # Health endpoint (no rate limit)
        location /api/health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana — login formu brute-force'a karşı dar bir limitle korunur.
        # DİKKAT: proxy_pass'te DEĞİŞKEN kullanılıyor. nginx `upstream` bloklarını
        # AÇILIŞTA çözer; grafana container'ı ayakta değilse
        # "[emerg] host not found in upstream" ile nginx HİÇ açılmaz ve API dahil
        # bütün site çöker (28 Tem 2026'da yaşandı). Değişkenli proxy_pass
        # çözümlemeyi istek anına erteler → grafana ölse sadece burası 502 verir.
        # 127.0.0.11 Docker'ın gömülü DNS'i (tüm compose ağlarında sabit).
        location /grafana/ {
            limit_req zone=grafana burst=10 nodelay;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $grafana_upstream http://grafana:3000;
            # URI parçası YOK (13 Eyl 2026): sondaki `/` /grafana/ önekini silip
            # Grafana'ya `/` gönderiyordu; serve_from_sub_path=true olan Grafana
            # /grafana/'ye geri yönlendirince sonsuz 301 döngüsü oluşuyordu. Önek
            # korununca Grafana kendi sub path'inde doğru çalışır (resmi nginx örneği).
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        location / {
            limit_req zone=web burst=100 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Eski domain → yeni domaine kalıcı yönlendirme (2 Eyl 2026, domain
    # değişikliği — nexstreamnewsengine.duckdns.org yerine nexstreamnews.com).
    # Aynı sertifikayı kullanıyor (SAN'da ikisi de var), sadece host'a göre
    # ayrı bir server bloğu — yukarıdaki asıl blok artık bu host'u eşlemiyor
    # (server_name artık `_` değil, spesifik).
    server {
        listen 443 ssl;
        server_name nexstreamnewsengine.duckdns.org;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://nexstreamnews.com$request_uri;
    }
}
