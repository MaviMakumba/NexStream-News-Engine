global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nexstream-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "nexstream-api"

  # v2.1.1 (18 Ağu 2026): worker kendi prometheus_client HTTP sunucusunu 9100'de
  # açıyor (bkz. kafka_consumer.py) — articles_processed_total/analysis_fallback_total
  # gibi ASIL pipeline sayaçları worker'da artıyor, bu job olmadan Prometheus'a
  # hiç ulaşmıyorlardı (alert kuralı yazılana kadar fark edilmemişti).
  - job_name: "nexstream-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: "nexstream-worker"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
