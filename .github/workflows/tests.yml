name: Tests

on:
  push:
    branches: [ main ]
    # Sadece dokümantasyon değişen push'lar (CLAUDE.md, docs/, README) ne test
    # ne DEPLOY tetikler — t3.small'da her deploy RAM/CPU-credit riski (bkz.
    # CHANGELOG 11 Eylül). PR tetikleyicisinde paths-ignore YOK: PR yine test edilir.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nexstream
          POSTGRES_PASSWORD: nexstream
          POSTGRES_DB: nexstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: nexstream
      DB_PASSWORD: nexstream
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: nexstream_db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"   # node --test ile .ts test dosyaları için tip soyma (>=22.6)
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # 29 Eylül 2026: mobil kullanılabilirlik regresyonu (taşma, dokunma hedefi,
      # iOS input zoom, mobil menü). Backend gerektirmez — API testte taklit
      # edilir. Kırılırsa `test`+`frontend` needs'i yüzünden deploy da başlamaz.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile usability tests
        run: npm run test:mobile

  # 19 Ağu 2026 güvenlik denetimi: Dependabot haftalık version-bump PR'ları
  # açıyor ama build'i bilinen bir CVE'de UYARAN bir CI adımı yoktu. Bilinçli
  # olarak continue-on-error: true — hem backend'de (torch/transformers gibi
  # transitive bağımlılıklarda düzeltmesi major bump gerektiren CVE'ler var)
  # hem frontend'de (Next 16 bump'ı Dependabot'ta zaten bekliyor, roadmap'te
  # ayrı bir karar) audit ŞU AN kırmızı — blocking yapmak her PR'ı durdururdu.
  # Amaç: sonucu GÖRÜNÜR kılmak, build'i durdurmak değil.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pip-audit (backend, non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend, non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # 7 Ekim 2026 (roadmap #28): imajlar EC2'de DEĞİL burada build edilir. EC2'de
  # `docker compose up --build` t3.small'ı 11 Eyl / 18 Eyl / 7 Eki'de defalarca
  # kilitledi (SSM ~30 dk InProgress, load 10-12, site erişilemez). Artık EC2 sadece
  # `docker compose pull` + `up -d --no-build` yapar (bkz. infra/scripts/deploy_images.sh).
  #
  # Deterministik build: SOURCE_DATE_EPOCH + rewrite-timestamp → içeriği değişmeyen
  # servis AYNI digest'e sahip olur, deploy'da compose onu yeniden yaratmaz (özellikle
  # RAM-ağır embedder). Etiketler: `main` (kayan) + `<sha>` (değişmez, geri alma için).
  build-images:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: .
            file: ./Dockerfile
          - name: scheduler
            context: .
            file: ./Dockerfile.light
          - name: embedder
            context: .
            file: ./Dockerfile.embedder
          - name: backup
            context: ./infra/backup
            file: ./infra/backup/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api
              NEXT_PUBLIC_SITE_URL=https://nexstreamnews.com
              NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
              NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
              NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/mavimakumba/nexstream-${{ matrix.name }}:main
            ghcr.io/mavimakumba/nexstream-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=1735689600
            ${{ matrix.build_args }}
          # Sabit zaman damgası → aynı içerik = aynı digest (bkz. üstteki not).
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 25 Ağu 2026: roadmap madde 19'un kalan kısmı — main'e her merge artık
  # otomatik olarak prod'u redeploy ediyor. Öncesinde bu adım hep ELLE SSM
  # ile tetikleniyordu (kırık bir şey main'e merge edilip unutulursa fark
  # edilmezdi). `test`+`frontend` başarısız olursa deploy hiç çalışmaz —
  # `security-audit` bilinçli olarak needs listesinde yok, zaten
  # continue-on-error olduğu için engelleyici değil.
  deploy:
    name: Deploy to production (SSM)
    runs-on: ubuntu-latest
    needs: [test, frontend, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # 11 Eylül 2026: art arda birden fazla main merge'i (kısa aralıklarla,
    # bu oturumda 3 kez üst üste) her biri kendi build-yoğun deploy'unu
    # tetikliyordu — t3.small'ın (burstable) sınırlı CPU credit havuzu
    # tükenip instance'ın SSM Agent'ı bile yanıt veremez hale geldi (SSM
    # komutları "Undeliverable" döndü), site tamamen erişilemez oldu, iki
    # kez `aws ec2 reboot-instances` gerekti. Bu concurrency grubu YENİ bir
    # deploy'un ÖNCEKİ bitmeden BAŞLAMASINI engeller — kuyruğa alır
    # (cancel-in-progress:false, yarım kalan bir `docker compose up`'ı asla
    # iptal etme, o daha tehlikeli). Kök nedenin kendisi (CPU credit
    # tükenmesi) hâlâ AÇIK — kalıcı çözüm CPU Credit modunu "Unlimited"a
    # almak (kullanıcı kararı bekliyor, bkz. CLAUDE.md).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: i-0608c897a3d8ca3f3
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 7 Eki 2026: EC2'de BUILD YOK. Komut: son main'i al (compose + betikler),
          # sonra infra/scripts/deploy_images.sh imajları GHCR'dan çekip yalnız
          # değişen servisleri yeniden yaratır, nginx'i tazeler (upstream DNS, 3-4 Eyl
          # dersi) ve localhost'tan health-check yapar (Cloudflare'e takılmamak için,
          # 11 Eyl dersi). GITHUB_TOKEN kısa ömürlüdür (iş bitince geçersiz) ve
          # betik çıkışta `docker logout` yapar; yine de SSM komut geçmişinde görünür.
          # Eski build-tabanlı akıştaki Prometheus/Grafana/Loki durdurma ara-önlemi
          # artık gereksiz: RAM'i yiyen build adımı yok.
          PARAMS=$(jq -n --arg tok "$GHCR_TOKEN" --arg tag "$IMAGE_TAG" '{commands: [
            "export HOME=/home/ubuntu",
            "cd ~/NexStream-News-Engine",
            "git config --global --add safe.directory $(pwd)",
            "git checkout main",
            "git fetch origin",
            "git reset --hard origin/main",
            ("IMAGE_TAG=" + $tag + " GHCR_TOKEN=" + $tok + " bash infra/scripts/deploy_images.sh")
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS="InProgress"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "  [$i] status=$STATUS"
            case "$STATUS" in
              InProgress|Pending|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy komutu başarısız oldu (status=$STATUS)"
            exit 1
          fi
          # Health-check artık yukarıdaki SSM komutunun İÇİNDE (bkz. not) —
          # "Success" dönmesi zaten localhost health-check'in de geçtiği
          # anlamına gelir, ayrı bir adıma gerek yok.