name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nexstream
          POSTGRES_PASSWORD: nexstream
          POSTGRES_DB: nexstream_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: nexstream
      DB_PASSWORD: nexstream
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: nexstream_db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # 19 Ağu 2026 güvenlik denetimi: Dependabot haftalık version-bump PR'ları
  # açıyor ama build'i bilinen bir CVE'de UYARAN bir CI adımı yoktu. Bilinçli
  # olarak continue-on-error: true — hem backend'de (torch/transformers gibi
  # transitive bağımlılıklarda düzeltmesi major bump gerektiren CVE'ler var)
  # hem frontend'de (Next 16 bump'ı Dependabot'ta zaten bekliyor, roadmap'te
  # ayrı bir karar) audit ŞU AN kırmızı — blocking yapmak her PR'ı durdururdu.
  # Amaç: sonucu GÖRÜNÜR kılmak, build'i durdurmak değil.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pip-audit (backend, non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend, non-blocking)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  # 25 Ağu 2026: roadmap madde 19'un kalan kısmı — main'e her merge artık
  # otomatik olarak prod'u redeploy ediyor. Öncesinde bu adım hep ELLE SSM
  # ile tetikleniyordu (kırık bir şey main'e merge edilip unutulursa fark
  # edilmezdi). `test`+`frontend` başarısız olursa deploy hiç çalışmaz —
  # `security-audit` bilinçli olarak needs listesinde yok, zaten
  # continue-on-error olduğu için engelleyici değil.
  deploy:
    name: Deploy to production (SSM)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: i-0608c897a3d8ca3f3
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["export HOME=/home/ubuntu","cd ~/NexStream-News-Engine","git config --global --add safe.directory $(pwd)","git checkout main","git fetch origin","git reset --hard origin/main","docker compose -f docker-compose.prod.yml up --build -d"]}' \
            --timeout-seconds 900 \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS="InProgress"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "  [$i] status=$STATUS"
            case "$STATUS" in
              InProgress|Pending|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy komutu başarısız oldu (status=$STATUS)"
            exit 1
          fi

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS https://nexstreamnews.com/api/health; then
              echo "Healthy"
              exit 0
            fi
            echo "Retry $i..."
            sleep 15
          done
          echo "::error::Health check zaman aşımına uğradı"
          exit 1