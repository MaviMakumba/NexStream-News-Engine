services:
  # 1. PYTHON UYGULAMAMIZ
  app:
    build: .
    container_name: nexstream_engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_HOST=redpanda
      - KAFKA_PORT=29092
      - API_KEY=${API_KEY:-dev-key-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - REDIS_URL=redis://redis:6379/0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-}
      - BILLING_DEV_MODE=${BILLING_DEV_MODE:-true}   # dev compose: Stripe'sız demo açık
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}   # dev compose: HTTP üzerinden çalışır, Secure kapalı
      # hf-xet (Hugging Face'in yeni "Xet" depolama backend'i) bu ortamda ilk
      # SentenceTransformer indirmesinde birkaç KB'da tıkanıp kalıyordu (klasik
      # HTTPS indirme sorunsuz çalışıyor) — klasik indirme yoluna zorluyoruz.
      - HF_HUB_DISABLE_XET=1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # 2. VERİTABANI (PostgreSQL) — sadece internal ağda erişilebilir
  db:
    image: postgres:15-alpine
    container_name: nexstream_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. YÖNETİM PANELİ (Adminer)
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # 4. MESAJ KUYRUĞU (Redpanda) — Kafka wire-protokolüyle uyumlu, tek binary,
  # arm64 destekli (Confluent'in Kafka+Zookeeper imajları amd64-only olduğu için
  # v1.18'de değiştirildi — bkz. CLAUDE.md). aiokafka client'ı değişmeden çalışır.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: nexstream_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # 6. ARKA PLAN İŞÇİSİ (Consumer)
  worker:
    build: .
    container_name: nexstream_worker
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: python -m src.adapters.messaging.kafka_consumer
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - HF_HUB_DISABLE_XET=1
    volumes:
      - .:/app

  # 7. ZAMANLAYICI (Scheduler)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.light
    container_name: nexstream_scheduler
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: python -m src.adapters.scheduling.scheduler_service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - SCRAPE_SOURCES=TRT Haber,BBC Türkçe,Hürriyet,Hürriyet Spor,Sabah,CNN Türk,Sözcü,Habertürk,HT Spor,Anadolu Ajansı,AA Ekonomi,BBC Technology,BBC Sport,Guardian Tech,TechCrunch,Hacker News,The Verge
    volumes:
      - .:/app

  # 8. FRONTEND (Next.js) — Streamlit'in yerini aldı
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nexstream_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - WATCHPACK_POLLING=true
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - nexstream_node_modules:/app/node_modules

  # 9. VEKTÖR VERİTABANI (ChromaDB) — sadece internal ağda
  chromadb:
    image: chromadb/chroma:latest
    container_name: nexstream_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE

  # 10. CACHE (Redis) — session'lar ve trending cache
  redis:
    image: redis:7-alpine
    container_name: nexstream_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data:
  redis_data:
  nexstream_node_modules:
