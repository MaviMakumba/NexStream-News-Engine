services:
  # ─── REVERSE PROXY ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexstream_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - frontend
      - backend

  # ─── CERTBOT (Let's Encrypt) ──────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: nexstream_certbot
    volumes:
      - ./infra/nginx/ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend

  # ─── FASTAPI APP ───────────────────────────────────────────────
  app:
    build: .
    container_name: nexstream_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      # Settings._reject_unsafe_production_config guard'ını aktive eder — API_KEY
      # varsayılan kalmışsa, BILLING_DEV_MODE açıksa, CORS wildcard'saysa ya da
      # session cookie Secure değilse uygulama AÇILMAYI REDDEDER (güvenlik denetimi).
      - ENVIRONMENT=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_HOST=redpanda
      - KAFKA_PORT=29092
      - API_KEY=${API_KEY}
      - LOG_FORMAT=json
      # Gerçek domain'e sabitlenmeli (örn. https://nexstream.news) — boş/wildcard
      # kalırsa yukarıdaki startup guard uygulamayı başlatmaz.
      - CORS_ORIGINS=${CORS_ORIGINS}
      # v1.11: Stripe + admin bootstrap. BILLING_DEV_MODE prod'da daima false!
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-}
      - BILLING_DEV_MODE=false
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - REDIS_URL=redis://redis:6379/0
      # v1.12: şifre sıfırlama maili. FRONTEND_URL gerçek domain ile set edilmeli,
      # yoksa reset linki yanlışlıkla localhost:3000'e gider!
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-NexStream <no-reply@nexstream.news>}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SESSION_COOKIE_SECURE=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    labels:
      logging: "promtail"
    networks:
      - backend
      - frontend

  # ─── DATABASE ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nexstream_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - backend

  # ─── REDPANDA (Kafka-uyumlu broker) ────────────────────────────
  # Confluent'in Kafka+Zookeeper imajları amd64-only olduğu için v1.18'de
  # değiştirildi (Oracle Cloud Always Free ARM deploy'unu mümkün kılmak için,
  # bkz. DEPLOY.md). Tek binary, Zookeeper yok, aiokafka client'ı değişmeden çalışır.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: nexstream_redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr internal://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:29092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    networks:
      - backend

  # ─── WORKER ────────────────────────────────────────────────────
  worker:
    build: .
    container_name: nexstream_worker
    restart: always
    depends_on:
      redpanda:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    command: python -m src.adapters.messaging.kafka_consumer
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-NexStream <no-reply@nexstream.news>}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    labels:
      logging: "promtail"
    networks:
      - backend

  # ─── SCHEDULER ────────────────────────────────────���────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.light
    container_name: nexstream_scheduler
    restart: always
    depends_on:
      redpanda:
        condition: service_healthy
    command: python -m src.adapters.scheduling.scheduler_service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - SCRAPE_SOURCES=TRT Haber,BBC Türkçe,Hürriyet,Hürriyet Spor,Sabah,CNN Türk,Sözcü,Habertürk,HT Spor,BBC Technology,BBC Sport
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    labels:
      logging: "promtail"
    networks:
      - backend

  # ─── FRONTEND (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: nexstream_frontend
    restart: always
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      logging: "promtail"
    networks:
      - frontend
      - backend

  # ─── REDIS (cache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexstream_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - backend

  # ─── CHROMADB ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: nexstream_chromadb
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - backend

  # ─── PROMETHEUS ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nexstream_prometheus
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring
      - backend

  # ─── GRAFANA ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nexstream_grafana
    restart: always
    environment:
      # Güvenlik denetimi: eski ":-nexstream" fallback'i .env'de GRAFANA_PASSWORD
      # unutulursa herkesçe bilinen bir şifreyle prod'a çıkılmasına yol açıyordu.
      # Boş bırakılırsa Grafana'nın KENDİ varsayılanı ("admin") devreye girer ki
      # o daha da öngörülebilir — bu yüzden ":?..." ile docker compose'un derleme
      # anında SERT HATA vermesi sağlandı, sessiz zayıf fallback'e izin verilmiyor.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD .env icinde set edilmeli - guclu/rastgele bir sifre uretin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring
      - frontend

  # ─── LOKI ──────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: nexstream_loki
    restart: always
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring

  # ─── PROMTAIL ──────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: nexstream_promtail
    restart: always
    volumes:
      - ./infra/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - monitoring
      - backend

  # ─── BACKUP ────────────────────────────────────────────────────
  backup:
    build: ./infra/backup
    container_name: nexstream_backup
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RETENTION_DAYS=7
      # Opt-in şifreleme — boş bırakılırsa yedekler düz metin kalır (v1.18 güvenlik denetimi).
      - BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE:-}
      # Opt-in offsite upload — örn. "b2:nexstream-backups" veya "s3:my-bucket/nexstream".
      # Boş bırakılırsa sadece local volume'a yazılır. rclone.conf'u aşağıdaki mount ile sağlayın.
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
    volumes:
      - chroma_data:/chroma-data:ro
      - backup_data:/backups
      - ./infra/backup/crontab:/var/spool/cron/crontabs/root:ro
      # Offsite upload kullanılacaksa: infra/backup/rclone.conf.example'ı kopyalayıp
      # ./infra/backup/rclone.conf olarak gerçek key'lerle doldurun (git'e girmez,
      # bkz. .gitignore). RCLONE_REMOTE boşsa bu dosya hiç okunmaz, mount zararsızdır.
      # Dosya yoksa Docker onu boş bir DİZİN olarak mount eder — ilk prod deploy'dan
      # önce en azından .example'ı kopyalayarak boş bir dosya olarak var olduğundan emin olun.
      - ./infra/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend

volumes:
  postgres_data:
  chroma_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  backup_data:
  certbot_webroot:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true
