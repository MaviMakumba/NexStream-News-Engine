services:
  # ─── REVERSE PROXY ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexstream_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - frontend
      - backend

  # ─── CERTBOT (Let's Encrypt) ──────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: nexstream_certbot
    volumes:
      - ./infra/nginx/ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend

  # ─── FASTAPI APP ───────────────────────────────────────────────
  app:
    build: .
    container_name: nexstream_engine
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy
    # --root-path /api: nginx bu servise proxy'lerken /api/ prefix'ini SIYIRIYOR
    # (bkz. nginx.conf location /api/), yani uvicorn kendi rotalarını hâlâ
    # /docs, /openapi.json vb. olarak tanımlıyor — DOĞRU. Ama --root-path
    # olmadan Swagger UI'ın HTML'i openapi_url'i "/openapi.json" (kök-mutlak)
    # yazıyordu; tarayıcı nginx'in /api/ prefix'ini bilmediği için isteği
    # https://domain/openapi.json'a atıyordu (nginx'te o yol için location
    # yok) → "Fetch error Not Found /openapi.json". --root-path SADECE
    # Swagger UI'ın gösterdiği/ürettiği URL'leri düzeltir, gerçek iç routing'i
    # DEĞİŞTİRMEZ (18 Ağu 2026'da bulundu — CSP düzeltmesi beyaz sayfayı
    # açınca altındaki bu ikinci katman ortaya çıktı).
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2 --root-path /api
    environment:
      # Settings._reject_unsafe_production_config guard'ını aktive eder — API_KEY
      # varsayılan kalmışsa, BILLING_DEV_MODE açıksa, CORS wildcard'saysa ya da
      # session cookie Secure değilse uygulama AÇILMAYI REDDEDER (güvenlik denetimi).
      - ENVIRONMENT=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_HOST=redpanda
      - KAFKA_PORT=29092
      - API_KEY=${API_KEY}
      - LOG_FORMAT=json
      # Gerçek domain'e sabitlenmeli (örn. https://nexstream.news) — boş/wildcard
      # kalırsa yukarıdaki startup guard uygulamayı başlatmaz.
      - CORS_ORIGINS=${CORS_ORIGINS}
      # v1.11: Stripe + admin bootstrap. BILLING_DEV_MODE prod'da daima false!
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_ENTERPRISE_PRICE_ID=${STRIPE_ENTERPRISE_PRICE_ID:-}
      - BILLING_DEV_MODE=false
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # v2.1: owner rolü — sadece app'te gerekli (route-level yetki kontrolü burada yapılır)
      - OWNER_EMAILS=${OWNER_EMAILS:-}
      - REDIS_URL=redis://redis:6379/0
      # v1.12: şifre sıfırlama maili. FRONTEND_URL gerçek domain ile set edilmeli,
      # yoksa reset linki yanlışlıkla localhost:3000'e gider!
      # v2.1: EMAIL_PROVIDER=auto ise SMTP kimlikleri doluysa SMTP, yoksa Resend,
      # o da yoksa Console'a düşer (artık sessizce değil — bkz. warn_if_email_disabled).
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-auto}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-NexStream <no-reply@nexstream.news>}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - SESSION_COOKIE_SECURE=true
      - EMBEDDER_URL=http://embedder:8000
      # v2.4: hata takibi — boş bırakılırsa init_sentry() no-op kalır.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          # 4G idi — 1.9GB'lik bir makinede anlamsizdi (limit fiilen yoktu, tek
          # bir sizinti tum kutuyu OOM'a surukleyebilirdi). Olculen: 132 MiB
          # (tek uvicorn worker'i, 29 Tem 2026); prod iki worker calistiriyor
          # ve model artik burada YUKLENMIYOR, o yuzden 768M ~3x tampon birakir.
          memory: 768M
          cpus: "2.0"
    labels:
      logging: "promtail"
    networks:
      - backend
      - frontend

  # ─── DATABASE ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nexstream_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - backend

  # ─── REDPANDA (Kafka-uyumlu broker) ────────────────────────────
  # Confluent'in Kafka+Zookeeper imajları amd64-only olduğu için v1.18'de
  # değiştirildi (Oracle Cloud Always Free ARM deploy'unu mümkün kılmak için,
  # bkz. DEPLOY.md). Tek binary, Zookeeper yok, aiokafka client'ı değişmeden çalışır.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: nexstream_redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp=1
      # KRİTİK: Seastar heap'i container limitine (aşağıda 768M) ASLA EŞİT
      # OLMAMALI. 768M/768M ile denendiğinde Seastar cgroup içinde 724MiB görüp
      # "insufficient physical memory: needed 805306368 available 759169024"
      # ile hiç açılmıyordu (28 Tem 2026 AWS deploy'u; o gün sunucuda elle
      # düzeltildi ama repo'ya girmemişti — 29 Tem'de burada yakalandı).
      # 256M, t3.small bütçesi için ayrıca bilinçli bir kısma: bu iş yükünde
      # (dakikada birkaç scrape mesajı) fazlasıyla yeterli.
      - --memory=256M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr internal://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:29092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    networks:
      - backend

  # ─── WORKER ────────────────────────────────────────────────────
  worker:
    build: .
    container_name: nexstream_worker
    restart: always
    depends_on:
      redpanda:
        condition: service_healthy
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy
    command: python -m src.adapters.messaging.kafka_consumer
    environment:
      # app'te vardı, worker'da unutulmuştu (25 Ağu 2026'da bulundu) — bu satır
      # olmadan Sentry event'leri yanlışlıkla "development" etiketleniyor VE
      # settings.py::_reject_unsafe_production_config guard'ı worker için hiç
      # çalışmıyordu.
      - ENVIRONMENT=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-auto}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-NexStream <no-reply@nexstream.news>}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - EMBEDDER_URL=http://embedder:8000
      # v2.4: hata takibi — boş bırakılırsa init_sentry() no-op kalır.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    deploy:
      resources:
        limits:
          # 4G idi — bkz. app'teki gerekce. Olculen: 96 MiB (29 Tem 2026),
          # model artik burada yuklenmiyor. 512M ~5x tampon.
          memory: 512M
          cpus: "2.0"
    labels:
      logging: "promtail"
    networks:
      - backend
      # egress ZORUNLU: worker'in butun isi disariya ulasmak (17 RSS kaynagi,
      # Groq API, Resend). backend internal oldugu icin tek basina DNS bile
      # cozemez — bkz. asagidaki networks tanimi.
      - egress

  # ─── EMBEDDER ──────────────────────────────────────────────────
  # SentenceTransformer modelini TEK kopya tutan servis. app ve worker modeli
  # kendi RAM'lerine ayrı ayrı yüklüyordu (~600MB israf) — artık ikisi de
  # embedding'i buraya HTTP ile soruyor. Sadece backend ağında, dışarı kapalı.
  embedder:
    build:
      context: .
      dockerfile: Dockerfile.embedder
    container_name: nexstream_embedder
    restart: always
    environment:
      - HF_HUB_DISABLE_XET=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      # Model image'a gömülü (bkz. Dockerfile.embedder) — indirme YOK, sadece
      # diskten yükleme. t3.small'ın 2 vCPU'sunda bu ~30-60sn sürüyor.
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 900M
          cpus: "1.0"
    labels:
      logging: "promtail"
    networks:
      - backend

  # ─── SCHEDULER ────────────────────────────────────���────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.light
    container_name: nexstream_scheduler
    restart: always
    depends_on:
      redpanda:
        condition: service_healthy
    command: python -m src.adapters.scheduling.scheduler_service
    environment:
      # worker'daki gibi — şu an davranışı etkilemiyor (scheduler init_sentry
      # çağırmıyor) ama tutarlılık için ekledik, ileride Sentry eklenirse hazır.
      - ENVIRONMENT=production
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - SCRAPE_SOURCES=TRT Haber,BBC Türkçe,Hürriyet,Hürriyet Spor,Sabah,CNN Türk,Sözcü,Habertürk,HT Spor,BBC Technology,BBC Sport
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    labels:
      logging: "promtail"
    networks:
      - backend

  # ─── FRONTEND (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: https://nexstreamnewsengine.duckdns.org
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    container_name: nexstream_frontend
    restart: always
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      logging: "promtail"
    networks:
      - frontend
      - backend

  # ─── REDIS (cache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexstream_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - backend

  # ─── CHROMADB ──────────────────────────────────────────────────
  chromadb:
    # :latest DEĞİL — sessiz sürüm atlamaları healthcheck'i kırdı (28 Tem 2026).
    # 1.5.9, 29 Tem 2026'da :latest ile BİREBİR aynı image (chroma sunucu 1.4.4).
    # DİKKAT: :1.5.5 etiketi daha ESKİ bir sunucu (1.4.1) — pin ederken etiket
    # numarasına değil `chroma --version` çıktısına bak, aksi halde mevcut veri
    # hacmine karşı sessizce downgrade yaparsın.
    image: chromadb/chroma:1.5.9
    container_name: nexstream_chromadb
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      # Bu imajda curl/wget/python/nc YOK — eski healthcheck `python` çağırdığı
      # için container kalıcı olarak unhealthy kalıyordu (28 Tem 2026 deploy'u).
      # Sadece bash var, o yüzden HTTP isteği /dev/tcp ile elle kuruluyor.
      # Yol da /api/v1 → /api/v2: v1 chroma 1.x'te kaldırıldı.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - backend

  # ─── PROMETHEUS ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nexstream_prometheus
    restart: always
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # t3.small (1.9GB) kısması: 30 gün → 7 gün + sert disk tavanı. Prometheus
      # aktif TSDB bloklarını mmap'liyor, pencere daraldıkça yerleşik bellek de
      # düşüyor. TEK ÖDÜN geriye bakış penceresi — servis de, paneller de,
      # metrikler de aynen çalışmaya devam eder, hiçbiri kaldırılmadı.
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=512MB"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring
      - backend

  # ─── GRAFANA ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nexstream_grafana
    restart: always
    environment:
      # Güvenlik denetimi: eski ":-nexstream" fallback'i .env'de GRAFANA_PASSWORD
      # unutulursa herkesçe bilinen bir şifreyle prod'a çıkılmasına yol açıyordu.
      # Boş bırakılırsa Grafana'nın KENDİ varsayılanı ("admin") devreye girer ki
      # o daha da öngörülebilir — bu yüzden ":?..." ile docker compose'un derleme
      # anında SERT HATA vermesi sağlandı, sessiz zayıf fallback'e izin verilmiyor.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD .env icinde set edilmeli - guclu/rastgele bir sifre uretin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # v2.1.1: alert e-postaları için — app'in SMTP hesabıyla AYNI Gmail
      # hesabı paylaşılıyor (SMTP_USER/SMTP_PASSWORD zaten .env'de). SMTP_USER
      # boşsa Grafana kimliksiz bağlanmayı dener ve göndermede sessizce
      # başarısız olur (Grafana AÇILMAYI reddetmez) — alert'ler yine de
      # "firing" olarak Grafana UI'ında görünür, sadece e-posta gitmez.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}:${SMTP_PORT:-587}
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_USER:-alerts@nexstream.news}
      - GF_SMTP_FROM_NAME=NexStream Alerts
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring
      - frontend

  # ─── LOKI ──────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: nexstream_loki
    restart: always
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - monitoring

  # ─── PROMTAIL ──────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: nexstream_promtail
    restart: always
    volumes:
      - ./infra/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - monitoring
      - backend

  # ─── BACKUP ────────────────────────────────────────────────────
  backup:
    build: ./infra/backup
    container_name: nexstream_backup
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - RETENTION_DAYS=7
      # Opt-in şifreleme — boş bırakılırsa yedekler düz metin kalır (v1.18 güvenlik denetimi).
      - BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE:-}
      # Opt-in offsite upload — örn. "b2:nexstream-backups" veya "s3:my-bucket/nexstream".
      # Boş bırakılırsa sadece local volume'a yazılır. rclone.conf'u aşağıdaki mount ile sağlayın.
      - RCLONE_REMOTE=${RCLONE_REMOTE:-}
    volumes:
      - chroma_data:/chroma-data:ro
      - backup_data:/backups
      - ./infra/backup/crontab:/var/spool/cron/crontabs/root:ro
      # Offsite upload kullanılacaksa: infra/backup/rclone.conf.example'ı kopyalayıp
      # ./infra/backup/rclone.conf olarak gerçek key'lerle doldurun (git'e girmez,
      # bkz. .gitignore). RCLONE_REMOTE boşsa bu dosya hiç okunmaz, mount zararsızdır.
      # Dosya yoksa Docker onu boş bir DİZİN olarak mount eder — ilk prod deploy'dan
      # önce en azından .example'ı kopyalayarak boş bir dosya olarak var olduğundan emin olun.
      - ./infra/backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - backend
      # egress: RCLONE_REMOTE ile offsite yedek yuklemesi yapilandirildiysa
      # disariya cikmasi gerekiyor. backend internal oldugu icin bu olmadan
      # yukleme SESSIZCE basarisiz olurdu.
      - egress

volumes:
  postgres_data:
  chroma_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  backup_data:
  certbot_webroot:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  # DIŞA ÇIKIŞ AĞI — `backend` internal:true olduğu için oradaki container'ların
  # İNTERNETİ YOKTUR ve DNS bile çözemezler. Dış bir servise ulaşması gereken
  # her container ayrıca BUNA da bağlanmalı.
  #
  # 29 Tem 2026'da canlıda yakalandı: `worker` yalnızca `backend`'deydi, yani
  # RSS kaynaklarına ve Groq'a hiç ulaşamıyordu ("Temporary failure in name
  # resolution"). Yığın sağlıklı görünüyor, /health yeşil dönüyor ama HİÇ HABER
  # TOPLANMIYORDU — sessiz ve tam bir işlevsizlik. `backup` da aynı durumdaydı
  # (RCLONE_REMOTE ile offsite yükleme yapılandırılmışsa sessizce başarısız olur).
  #
  # `app` bu ağa EKLENMEDİ çünkü zaten `frontend` ağında (nginx ona oradan
  # ulaşıyor) ve o ağ internal DEĞİL — yani çıkışı var.
  egress:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true
